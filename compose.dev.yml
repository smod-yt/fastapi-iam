name: dev_fastapi_iam

services:
  postgres:
    image: postgres:18-alpine
    container_name: dev_postgres
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "${POSTGRES_PORT:-5430}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: dev_redis
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "${REDIS_PORT:-6377}:6379"
    volumes:
      - dev_redis_data:/data
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec

volumes:
  dev_postgres_data:
  dev_redis_data:
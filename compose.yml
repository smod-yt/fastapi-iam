name: fastapi_iam

services:
  migrate:
    image: ${APP_IMAGE:-fastapi-iam:local}
    command: alembic upgrade head
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    image: ${APP_IMAGE:-fastapi-iam:local}
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

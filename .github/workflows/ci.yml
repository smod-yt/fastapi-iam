name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start PostgreSQL and Redis
        run: docker compose -f compose.test.yml --env-file .env.test up -d --wait

      - name: Run tests
        run: python -m pytest -q

      - name: Stop PostgreSQL and Redis
        if: always()
        run: docker compose -f compose.test.yml --env-file .env.test down -v
